<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 908" width="900" height="908" role="img" aria-labelledby="dp-t dp-d"><title id="dp-t">What an outside scholarship does to an aid package</title><desc id="dp-d">Four bars of one cost of attendance on a shared scale. The package as offered fills need with a grant and a subsidized loan. A scholarship pushes assistance past need. The college then reduces either the loan, which leaves the family better off, or its own grant, which leaves the family no better off.</desc><rect width="900" height="908" fill="#ffffff"/><text x="40" y="44" font-size="34" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">One scholarship, three endings</text><text x="40" y="78" font-size="26" fill="#6b6f77" font-family="Georgia,serif">A year at $22,528, the median in-state public, on a $75,000 income</text><text x="40" y="130" font-size="28" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">As offered</text><rect x="40.0" y="146" width="486.7" height="46" fill="#12335c" stroke="#ffffff" stroke-width="1"/><rect x="526.7" y="146" width="108.2" height="46" fill="#b8c4d4" stroke="#ffffff" stroke-width="1"/><rect x="634.8" y="146" width="101.5" height="46" fill="#eb6834" stroke="#ffffff" stroke-width="1"/><rect x="40.0" y="141" width="594.8" height="56" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="40" y="227" font-size="26" fill="#6b6f77" font-family="Georgia,serif">Need is $19,244 and the package fills it exactly.</text><text x="40" y="273" font-size="28" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">A $4,000 scholarship arrives</text><rect x="40.0" y="289" width="486.7" height="46" fill="#12335c" stroke="#ffffff" stroke-width="1"/><rect x="526.7" y="289" width="108.2" height="46" fill="#b8c4d4" stroke="#ffffff" stroke-width="1"/><rect x="634.8" y="289" width="123.6" height="46" fill="#5c6b1f" stroke="#ffffff" stroke-width="1"/><rect x="758.5" y="289" width="101.5" height="46" fill="#eb6834" stroke="#ffffff" stroke-width="1"/><rect x="40.0" y="284" width="594.8" height="56" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="40" y="370" font-size="26" fill="#6b6f77" font-family="Georgia,serif">Now $4,000 of assistance sits past need. Something gives.</text><text x="40" y="416" font-size="28" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">It comes off the loan</text><rect x="40.0" y="432" width="471.2" height="46" fill="#12335c" stroke="#ffffff" stroke-width="1"/><rect x="511.2" y="432" width="123.6" height="46" fill="#5c6b1f" stroke="#ffffff" stroke-width="1"/><rect x="634.8" y="432" width="101.5" height="46" fill="#eb6834" stroke="#ffffff" stroke-width="1"/><rect x="40.0" y="427" width="594.8" height="56" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="40" y="513" font-size="26" fill="#6b6f77" font-family="Georgia,serif">$3,500 less borrowed. The family is better off by that.</text><text x="40" y="559" font-size="28" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">It comes off the college's grant</text><rect x="40.0" y="575" width="363.0" height="46" fill="#12335c" stroke="#ffffff" stroke-width="1"/><rect x="403.0" y="575" width="108.2" height="46" fill="#b8c4d4" stroke="#ffffff" stroke-width="1"/><rect x="511.2" y="575" width="123.6" height="46" fill="#5c6b1f" stroke="#ffffff" stroke-width="1"/><rect x="634.8" y="575" width="101.5" height="46" fill="#eb6834" stroke="#ffffff" stroke-width="1"/><rect x="40.0" y="570" width="594.8" height="56" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="40" y="656" font-size="26" fill="#6b6f77" font-family="Georgia,serif">Same bill, same loan. The family is better off by nothing.</text><rect x="40" y="708" width="30" height="24" fill="#12335c"/><text x="80" y="728" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">grant, the college's own money</text><rect x="40" y="744" width="30" height="24" fill="#b8c4d4"/><text x="80" y="764" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">subsidized loan</text><rect x="40" y="780" width="30" height="24" fill="#5c6b1f"/><text x="80" y="800" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">the outside scholarship</text><rect x="40" y="816" width="30" height="24" fill="#eb6834"/><text x="80" y="836" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">what the formula says the family pays</text><rect x="40" y="853" width="29" height="22" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="80" y="872" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">need, which is not an award</text></svg>