<svg xmlns="http://www.w3.org/2000/svg" width="900" height="930" viewBox="0 0 900 930" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #14161a; }
  .h  { font-size: 34px; font-weight: 700; }
  .sub{ font-size: 26px; fill: #5c636d; }
  .lab{ font-size: 27px; }
  .num{ font-size: 29px; font-weight: 700; }
  .ax { font-size: 26px; fill: #5c636d; }
  .key{ font-size: 26px; }
</style>
<rect width="900" height="930" fill="#ffffff"/>
<text class="h" x="40.0" y="52.0">The year, in order</text>
<text class="sub" x="40.0" y="96.0">Each date belongs to a chapter that has priced it</text>
<line x1="300" y1="152" x2="300" y2="746" stroke="#dfe3e8" stroke-width="4"/>
<circle cx="300" cy="176" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="186.0" text-anchor="end">October 1</text>
<text class="lab" x="334.0" y="186.0">The form opens</text>
<text class="ax" x="860.0" y="186.0" text-anchor="end" fill="#5c636d">Ch. 3</text>
<circle cx="300" cy="254" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="264.0" text-anchor="end">November</text>
<text class="lab" x="334.0" y="264.0">Binding deadlines land first</text>
<text class="ax" x="860.0" y="264.0" text-anchor="end" fill="#5c636d">Ch. 4</text>
<circle cx="300" cy="332" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="342.0" text-anchor="end">January</text>
<text class="lab" x="334.0" y="342.0">The numbers underneath reset</text>
<text class="ax" x="860.0" y="342.0" text-anchor="end" fill="#5c636d">Ch. 3</text>
<circle cx="300" cy="410" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="420.0" text-anchor="end">March, April</text>
<text class="lab" x="334.0" y="420.0">The letter</text>
<text class="ax" x="860.0" y="420.0" text-anchor="end" fill="#5c636d">Ch. 2</text>
<circle cx="300" cy="488" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="498.0" text-anchor="end">May 1</text>
<text class="lab" x="334.0" y="498.0">The reply date</text>
<text class="ax" x="860.0" y="498.0" text-anchor="end" fill="#5c636d">Ch. 4</text>
<circle cx="300" cy="566" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="576.0" text-anchor="end">July 1</text>
<text class="lab" x="334.0" y="576.0">The day the rules change</text>
<text class="ax" x="860.0" y="576.0" text-anchor="end" fill="#5c636d">Ch. 6</text>
<circle cx="300" cy="644" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="654.0" text-anchor="end">September 30</text>
<text class="lab" x="334.0" y="654.0">One form, one point</text>
<text class="ax" x="860.0" y="654.0" text-anchor="end" fill="#5c636d">Ch. 18</text>
<circle cx="300" cy="722" r="11" fill="#12335c"/>
<text class="lab" x="266.0" y="732.0" text-anchor="end">Six months out</text>
<text class="lab" x="334.0" y="732.0">The first payment</text>
<text class="ax" x="860.0" y="732.0" text-anchor="end" fill="#5c636d">Ch. 17</text>
<text class="ax" x="40.0" y="878.0">The order matters more than any single date.</text>
</svg>
