<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1080" width="900" height="1080" role="img" aria-labelledby="rf-t rf-d">
  <title id="rf-t">The federal payment moves with income and the refinanced payment does not</title>
  <desc id="rf-d">Two stacked panels sharing an income axis from twenty thousand to one hundred thousand dollars. The upper panel plots the monthly payment on a fifty thousand dollar balance: the federal line rises in steps with income, while the refinanced line is flat because a fixed payment does not know what the borrower earns. The two cross near 83,300 dollars of income. The lower panel plots the same payments as a share of gross income, where the refinanced line falls steeply as income rises and the federal line climbs gently, so at the lowest incomes the refinanced payment takes several times the share the federal one does.</desc>
  <style>
    .f { font-family: "Avenir Next", -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif; }
    .deck { font-size: 30px; font-weight: 600; fill: #14161a; }
    .key { font-size: 27px; font-weight: 500; fill: #14161a; }
    .ptitle { font-size: 28px; font-weight: 700; fill: #14161a; }
    .tick { font-size: 26px; font-weight: 500; fill: #5c636d; }
    .axis { font-size: 27px; font-weight: 500; fill: #5c636d; }
    .note { font-size: 26px; font-weight: 500; fill: #5c636d; }
    .mark-word { font-size: 19px; font-weight: 700; fill: #14161a; }
    .mark-tld { font-size: 19px; font-weight: 500; fill: #5c636d; }
  </style>
