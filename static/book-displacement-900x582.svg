<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 582" width="900" height="582" role="img" aria-labelledby="bd-t bd-d"><title id="bd-t">The same scholarship at two schools</title><desc id="bd-d">Two bars, one per school, on a shared scale. At San Diego State the grant already covers need, so a scholarship has nowhere to go inside it. At Berkeley a large part of need is unmet, so the same scholarship lands in the gap.</desc><rect width="900" height="582" fill="#ffffff"/><text x="40" y="52" font-size="34" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">The same award, at two of her schools</text><text x="40" y="88" font-size="26" fill="#6b6f77" font-family="Georgia,serif">Marisol Reyes, index $25,231 a year, and a $4,000 scholarship</text><text x="40" y="150" font-size="28" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">San Diego State, $27,780 a year</text><rect x="40.0" y="166" width="71.2" height="46" fill="#12335c" stroke="#ffffff" stroke-width="1"/><rect x="111.2" y="166" width="71.9" height="46" fill="#5c6b1f" stroke="#ffffff" stroke-width="1"/><rect x="40" y="161" width="45.8" height="56" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="40" y="247" font-size="26" fill="#6b6f77" font-family="Georgia,serif">Need $2,549, grant $3,959, need already covered.</text><text x="40" y="299" font-size="28" font-weight="700" fill="#1a1c1f" font-family="Georgia,serif">UC Berkeley, $45,619 a year</text><rect x="40.0" y="315" width="199.3" height="46" fill="#12335c" stroke="#ffffff" stroke-width="1"/><rect x="239.3" y="315" width="71.9" height="46" fill="#5c6b1f" stroke="#ffffff" stroke-width="1"/><rect x="40" y="310" width="366.5" height="56" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="40" y="396" font-size="26" fill="#6b6f77" font-family="Georgia,serif">Need $20,388, grant $11,090, $9,298 still open.</text><rect x="40" y="454" width="30" height="24" fill="#12335c"/><text x="80" y="474" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">grant, from the school's net price at her band</text><rect x="40" y="490" width="30" height="24" fill="#5c6b1f"/><text x="80" y="510" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">the outside scholarship</text><rect x="40" y="527" width="29" height="22" fill="none" stroke="#2a78d6" stroke-width="2.5" stroke-dasharray="7 5"/><text x="80" y="546" font-size="27" fill="#1a1c1f" font-family="Georgia,serif">need, which is cost of attendance less her index</text></svg>