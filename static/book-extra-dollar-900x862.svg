<svg xmlns="http://www.w3.org/2000/svg" width="900" height="862" viewBox="0 0 900 862" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #14161a; }
  .h  { font-size: 34px; font-weight: 700; }
  .sub{ font-size: 26px; fill: #5c636d; }
  .lab{ font-size: 27px; }
  .num{ font-size: 29px; font-weight: 700; }
  .ax { font-size: 26px; fill: #5c636d; }
  .key{ font-size: 26px; }
</style>
<rect width="900" height="862" fill="#ffffff"/>
<text class="h" x="40.0" y="52.0">Where an extra dollar goes</text>
<text class="sub" x="40.0" y="96.0">The order set by 34 CFR 685.211(a)(3)</text>
<rect x="40" y="168" width="820" height="96" rx="10" fill="#eef4fb" stroke="#2a78d6" stroke-width="3"/>
<text class="lab" x="68.0" y="210.0">Late charges and collection costs</text>
<text class="ax" x="68.0" y="244.0">first, if any are owed</text>
<text class="num" x="832.0" y="226.0" text-anchor="end" fill="#2a78d6">1</text>
<path d="M450.0 264 L450.0 288 M441.0 279 L450.0 288 L459.0 279" stroke="#5c636d" stroke-width="3" fill="none"/>
<rect x="40" y="294" width="820" height="96" rx="10" fill="#eef4fb" stroke="#2a78d6" stroke-width="3"/>
<text class="lab" x="68.0" y="336.0">Accrued interest</text>
<text class="ax" x="68.0" y="370.0">everything outstanding, before principal</text>
<text class="num" x="832.0" y="352.0" text-anchor="end" fill="#2a78d6">2</text>
<path d="M450.0 390 L450.0 414 M441.0 405 L450.0 414 L459.0 405" stroke="#5c636d" stroke-width="3" fill="none"/>
<rect x="40" y="420" width="820" height="96" rx="10" fill="#eef4fb" stroke="#2a78d6" stroke-width="3"/>
<text class="lab" x="68.0" y="462.0">Principal</text>
<text class="ax" x="68.0" y="496.0">what is left of the extra</text>
<text class="num" x="832.0" y="478.0" text-anchor="end" fill="#2a78d6">3</text>
<path d="M450.0 516 L450.0 540 M441.0 531 L450.0 540 L459.0 531" stroke="#5c636d" stroke-width="3" fill="none"/>
<rect x="40" y="546" width="820" height="96" rx="10" fill="#fdf1ec" stroke="#eb6834" stroke-width="3"/>
<text class="lab" x="68.0" y="588.0">Your next due date moves out</text>
<text class="ax" x="68.0" y="622.0">unless you say otherwise</text>
<text class="num" x="832.0" y="604.0" text-anchor="end" fill="#eb6834">4</text>
<text class="lab" x="40.0" y="726.0">The fourth box is the default, not the rule.</text>
<text class="ax" x="40.0" y="766.0">Ask in writing for it to go to principal on a</text>
<text class="ax" x="40.0" y="802.0">loan you name, and for the due date to stay put.</text>
</svg>
