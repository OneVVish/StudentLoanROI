<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1256" width="900" height="1256" role="img" aria-labelledby="fm-t fm-d">
  <title id="fm-t">Where riding forgiveness out costs less than paying the loan off, under IBR and under RAP</title>
  <desc id="fm-d">Two stacked panels with balance along the bottom and adjusted gross income up the side, shaded blue where riding an income-driven plan to a taxed discharge costs less than the ten-year Standard plan and orange where it costs more. The IBR panel has one boundary rising with balance: blue below, orange above. The RAP panel has two: a blue wedge at the bottom, an orange band in the middle, and blue again above, because RAP has no payment ceiling and a high earner overpays and beats the Standard plan outright.</desc>
