<svg xmlns="http://www.w3.org/2000/svg" width="900" height="908" viewBox="0 0 900 908" role="img">
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #14161a; }
  .h  { font-size: 34px; font-weight: 700; }
  .sub{ font-size: 26px; fill: #5c636d; }
  .lab{ font-size: 27px; }
  .num{ font-size: 29px; font-weight: 700; }
  .ax { font-size: 26px; fill: #5c636d; }
  .key{ font-size: 26px; }
</style>
<rect width="900" height="908" fill="#ffffff"/>
<text class="h" x="40.0" y="52.0">The order to work in</text>
<text class="sub" x="40.0" y="96.0">Each step changes what the next one means</text>
<rect x="40" y="168" width="820" height="128" rx="10" fill="#f7f9fb" stroke="#dfe3e8" stroke-width="2"/>
<circle cx="86" cy="232.0" r="26" fill="#12335c"/>
<text class="num" x="86" y="242.0" text-anchor="middle" fill="#ffffff">1</text>
<text class="lab" x="132.0" y="218.0">What will this actually cost us?</text>
<text class="ax" x="132.0" y="256.0">Not the sticker. This family, this school.</text>
<text class="ax" x="832.0" y="218.0" text-anchor="end" fill="#5c636d">Ch. 3, 4, 5</text>
<rect x="40" y="324" width="820" height="128" rx="10" fill="#f7f9fb" stroke="#dfe3e8" stroke-width="2"/>
<circle cx="86" cy="388.0" r="26" fill="#12335c"/>
<text class="num" x="86" y="398.0" text-anchor="middle" fill="#ffffff">2</text>
<text class="lab" x="132.0" y="374.0">What is left to borrow, and in whose name?</text>
<text class="ax" x="132.0" y="412.0">$27,000, then $65,000, then a bank.</text>
<text class="ax" x="832.0" y="374.0" text-anchor="end" fill="#5c636d">Ch. 6, 7, 8</text>
<rect x="40" y="480" width="820" height="128" rx="10" fill="#f7f9fb" stroke="#dfe3e8" stroke-width="2"/>
<circle cx="86" cy="544.0" r="26" fill="#12335c"/>
<text class="num" x="86" y="554.0" text-anchor="middle" fill="#ffffff">3</text>
<text class="lab" x="132.0" y="530.0">What does the payment look like?</text>
<text class="ax" x="132.0" y="568.0">A monthly figure against a paycheck.</text>
<text class="ax" x="832.0" y="530.0" text-anchor="end" fill="#5c636d">Ch. 12</text>
<rect x="40" y="636" width="820" height="128" rx="10" fill="#f7f9fb" stroke="#dfe3e8" stroke-width="2"/>
<circle cx="86" cy="700.0" r="26" fill="#12335c"/>
<text class="num" x="86" y="710.0" text-anchor="middle" fill="#ffffff">4</text>
<text class="lab" x="132.0" y="686.0">Is the whole thing worth it?</text>
<text class="ax" x="132.0" y="724.0">Against not going, over your own horizon.</text>
<text class="ax" x="832.0" y="686.0" text-anchor="end" fill="#5c636d">Ch. 10, 11</text>
<text class="ax" x="40.0" y="860.0">Answer them out of order and the answers do not mean much.</text>
</svg>
