<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1902" width="900" height="1902" role="img" aria-labelledby="pa-t pa-d">
  <title id="pa-t">Monthly payment against income, by household size, on three income-driven plans</title>
  <desc id="pa-d">Five stacked panels, one per household size from one to five. Each plots the monthly payment against adjusted gross income for IBR at 10 percent, IBR at 15 percent and RAP. RAP rises in steps because it charges a fixed percentage within each ten thousand dollar band. Both IBR lines stay at zero until income passes the amount the household shelters, which grows with each person, while RAP subtracts a flat fifty dollars per dependent and never falls below ten dollars.</desc>
